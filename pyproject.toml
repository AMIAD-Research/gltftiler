[project]
name = "gltftiler"
version = "0.1.0"
description = "Toolbox to create gltf files for 3DTiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dracopy>=2.0.0",
    "jaxtyping>=0.3.9",
    "pygltflib>=1.16.5",
    "numpy>=2.4.6",
    "tyro>=1.0.16",
]

[project.scripts]
gltftiler = "gltftiler:cli"

[project.urls]
Homepage = "https://github.com/AMIAD-Research/gltftiler"
